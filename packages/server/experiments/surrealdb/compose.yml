name: retainer-surrealdb-experiment
services:
  surrealdb:
    image: surrealdb/surrealdb:v4.0.0@sha256:c35893410644e65fa90aa1bef446ac9cb0a0c2733b9d405ce3eb56754b85c330
    user: root
    command: start --user experiment --pass local-experiment --bind 0.0.0.0:8000 surrealkv:/data/experiment
    ports:
      - "127.0.0.1:${EXPERIMENT_SURREAL_PORT:-18180}:8000"
    volumes:
      - surreal-data:/data
  postgres:
    image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    environment:
      POSTGRES_USER: experiment
      POSTGRES_PASSWORD: local-experiment
      POSTGRES_DB: experiment
    ports:
      - "127.0.0.1:${EXPERIMENT_PG_PORT:-18181}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U experiment"]
      interval: 1s
      timeout: 3s
      retries: 30
volumes:
  surreal-data:
  postgres-data:
