name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs the same checks before publishing.
  workflow_call:

concurrency:
  # github.workflow is the caller's name when the release workflow calls this
  # one, so a release never cancels (or is cancelled by) CI on the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      RETAINER_SURREAL_URL: http://127.0.0.1:8000
      RETAINER_SURREAL_USER: root
      RETAINER_SURREAL_PASS: retainer

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The pinned SurrealDB release (spec section 1), persistent SurrealKV.
      - name: Start SurrealDB
        run: |
          docker run -d --name surrealdb --user root -p 8000:8000 -v retainer-surreal:/data \
            surrealdb/surrealdb@sha256:c35893410644e65fa90aa1bef446ac9cb0a0c2733b9d405ce3eb56754b85c330 \
            start --user root --pass retainer --bind 0.0.0.0:8000 surrealkv:/data/retainer
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @retainer/server exec playwright install --with-deps chromium
      - run: pnpm test:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-browser-traces
          path: packages/server/test-results
          retention-days: 7
