# Self-hosted Retainer: Postgres, plus one app container
# running both the API and the workers.
#   docker compose -f docker/compose.yml up --build
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: retainer
      POSTGRES_PASSWORD: retainer
      POSTGRES_DB: retainer
    ports:
      - "${RETAINER_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retainer"]
      interval: 2s
      timeout: 3s
      retries: 30

  retainer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgres://retainer:retainer@postgres:5432/retainer
      RETAINER_PUBLIC_ORIGIN: "${RETAINER_PUBLIC_ORIGIN:-}"
      RETAINER_SUPPRESSION_KEY: "${RETAINER_SUPPRESSION_KEY:-}"
      RETAINER_SUPPRESSION_PREVIOUS_KEYS: "${RETAINER_SUPPRESSION_PREVIOUS_KEYS:-}"
      RETAINER_ROLE: all
      PORT: "8787"
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
