# Self-hosted Retainer: SurrealDB (single node, persistent SurrealKV) and one
# app container running the API and the workers (RETAINER_ROLE=all).
#   docker compose -f docker/compose.yml up --build
# For development, start only the database:
#   docker compose -f docker/compose.yml up -d surrealdb
services:
  surrealdb:
    # SurrealDB 4.0.0 Community, the digest the migration spike tested.
    image: surrealdb/surrealdb:v4.0.0@sha256:c35893410644e65fa90aa1bef446ac9cb0a0c2733b9d405ce3eb56754b85c330
    user: root
    command: start --user ${RETAINER_SURREAL_USER:-root} --pass ${RETAINER_SURREAL_PASS:-retainer} --bind 0.0.0.0:8000 surrealkv:/data/retainer
    ports:
      - "127.0.0.1:${RETAINER_SURREAL_PORT:-8000}:8000"
    volumes:
      - surrealdata:/data
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 2s
      timeout: 3s
      retries: 30

  retainer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      RETAINER_SURREAL_URL: http://surrealdb:8000
      RETAINER_SURREAL_NAMESPACE: "${RETAINER_SURREAL_NAMESPACE:-retainer}"
      RETAINER_SURREAL_USER: "${RETAINER_SURREAL_USER:-root}"
      RETAINER_SURREAL_PASS: "${RETAINER_SURREAL_PASS:-retainer}"
      RETAINER_SIGNING_KEY: "${RETAINER_SIGNING_KEY:-}"
      RETAINER_SIGNING_PREVIOUS_KEYS: "${RETAINER_SIGNING_PREVIOUS_KEYS:-}"
      RETAINER_SIGNING_REVOKED_KEY_IDS: "${RETAINER_SIGNING_REVOKED_KEY_IDS:-}"
      RETAINER_PUBLIC_ORIGIN: "${RETAINER_PUBLIC_ORIGIN:-}"
      RETAINER_SUPPRESSION_KEY: "${RETAINER_SUPPRESSION_KEY:-}"
      RETAINER_SUPPRESSION_PREVIOUS_KEYS: "${RETAINER_SUPPRESSION_PREVIOUS_KEYS:-}"
      RETAINER_ROLE: all
      PORT: "8787"
    ports:
      - "8787:8787"
    depends_on:
      surrealdb:
        condition: service_healthy

volumes:
  surrealdata:
